<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cinto</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --radius: 5px;
      --gap: 8px;
      --green:  var(--vscode-terminal-ansiGreen,  #4ec9b0);
      --yellow: var(--vscode-terminal-ansiYellow, #dcdcaa);
      --red:    var(--vscode-terminal-ansiRed,    #f44747);
      --cyan:   var(--vscode-terminal-ansiCyan,   #4fc1ff);
      --muted:  var(--vscode-descriptionForeground);
      --border: var(--vscode-panel-border, rgba(255,255,255,.1));
      --card-bg: var(--vscode-editor-inactiveSelectionBackground, rgba(255,255,255,.04));
    }

    body {
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size);
      color: var(--vscode-foreground);
      background: var(--vscode-sideBar-background);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      min-height: 32px;
    }

    .header-brand {
      font-weight: 700;
      font-size: 12px;
      letter-spacing: .04em;
      color: var(--vscode-foreground);
    }

    .header-model {
      flex: 1;
      font-size: 11px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header-ctx {
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
    }

    /* ── Feed (scrollable middle section) ───────────────────────────────── */
    .feed {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Welcome screen */
    .welcome {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 16px 4px;
      color: var(--muted);
      font-size: 12px;
    }
    .welcome-title {
      font-weight: 600;
      font-size: 13px;
      color: var(--vscode-foreground);
    }
    .welcome ul {
      padding-left: 16px;
      line-height: 1.7;
    }

    /* Task bubble (user message) */
    .task-bubble {
      background: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
      border-radius: var(--radius);
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
      align-self: flex-end;
      max-width: 92%;
    }

    /* ── Stage card ─────────────────────────────────────────────────────── */
    .stage-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color .15s;
    }

    .stage-card[data-status="running"]  { border-color: var(--vscode-focusBorder, #007acc); }
    .stage-card[data-status="ok"]       { border-color: transparent; }
    .stage-card[data-status="approving"]{ border-color: var(--yellow); }
    .stage-card[data-status="failed"]   { border-color: var(--red); }

    .stage-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      cursor: default;
      user-select: none;
    }

    /* Status dot */
    .stage-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--muted);
      transition: background .2s;
    }
    [data-status="pending"]   .stage-dot { background: var(--border); }
    [data-status="running"]   .stage-dot { background: var(--vscode-focusBorder, #007acc); animation: pulse 1s ease-in-out infinite; }
    [data-status="ok"]        .stage-dot { background: var(--green); }
    [data-status="ok-approx"] .stage-dot { background: var(--yellow); }
    [data-status="skipped"]   .stage-dot { background: var(--muted); }
    [data-status="failed"]    .stage-dot { background: var(--red); }
    [data-status="approving"] .stage-dot { background: var(--yellow); animation: pulse 1s ease-in-out infinite; }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50%      { opacity: .35; }
    }

    .stage-name {
      font-size: 12px;
      font-weight: 600;
      flex: 1;
    }

    [data-status="pending"]  .stage-name { color: var(--muted); }
    [data-status="skipped"]  .stage-name { color: var(--muted); }

    .stage-time {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
    }

    .stage-badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .badge-approx   { background: rgba(220,220,170,.15); color: var(--yellow); }
    .badge-review   { background: rgba(220,220,170,.15); color: var(--yellow); }
    .badge-skipped  { background: rgba(255,255,255,.06); color: var(--muted); }
    .badge-retry    { background: rgba(220,220,170,.08); color: var(--yellow); }
    .badge-failed   { background: rgba(244, 71, 71,.15); color: var(--red); }

    /* Stage body (content area) */
    .stage-body {
      padding: 0 10px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stage-body:empty { display: none; }

    /* Retry message inside a stage */
    .retry-msg {
      font-size: 11px;
      color: var(--yellow);
      padding: 3px 0;
      word-break: break-word;
    }

    /* Content rows (files, terms, approach) */
    .content-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-top: 2px;
    }

    .content-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .pill {
      font-size: 11px;
      font-family: var(--vscode-editor-font-family, monospace);
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 1px 6px;
      color: var(--cyan);
    }

    .approach-text {
      font-size: 12px;
      color: var(--vscode-foreground);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Inline diff (inside patch stage card) ──────────────────────────── */
    .diff-block {
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
    }

    .diff-file-bar {
      background: rgba(255,255,255,.05);
      padding: 3px 8px;
      font-size: 11px;
      font-family: var(--vscode-editor-font-family, monospace);
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    .diff-lines {
      font-family: var(--vscode-editor-font-family, monospace);
      font-size: 12px;
      line-height: 1.6;
      padding: 6px 0;
      overflow-x: auto;
      max-height: 240px;
      overflow-y: auto;
    }

    .diff-line {
      display: block;
      padding: 0 8px;
      white-space: pre;
    }
    .diff-add    { background: rgba(78,201,176,.12); color: var(--green); }
    .diff-remove { background: rgba(244, 71,71,.10); color: var(--red); }
    .diff-hunk   { color: var(--cyan); background: rgba(79,193,255,.06); }

    /* Approval buttons */
    .approval-row {
      display: flex;
      gap: 6px;
      padding-top: 2px;
    }

    .btn-approve, .btn-reject {
      flex: 1;
      padding: 5px 0;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      font-family: var(--vscode-font-family);
      font-weight: 600;
      transition: opacity .1s;
    }
    .btn-approve:hover { opacity: .85; }
    .btn-reject:hover  { opacity: .85; }

    .btn-approve { background: var(--green); color: #000; }
    .btn-reject  { background: var(--red);   color: #fff; }

    /* ── Result card ────────────────────────────────────────────────────── */
    .result-card {
      background: rgba(78,201,176,.08);
      border: 1px solid rgba(78,201,176,.25);
      border-radius: var(--radius);
      padding: 10px;
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 12px;
      color: var(--green);
      margin-bottom: 6px;
    }

    .result-text {
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .result-files {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    /* ── Error card ─────────────────────────────────────────────────────── */
    .error-card {
      background: rgba(244,71,71,.08);
      border: 1px solid rgba(244,71,71,.25);
      border-radius: var(--radius);
      padding: 10px;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
      color: var(--red);
    }

    /* ── Input footer ───────────────────────────────────────────────────── */
    .input-area {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      padding: 8px 10px;
    }

    textarea {
      width: 100%;
      min-height: 60px;
      max-height: 140px;
      resize: vertical;
      font-family: var(--vscode-font-family);
      font-size: var(--vscode-font-size);
      color: var(--vscode-input-foreground);
      background: var(--vscode-input-background);
      border: 1px solid var(--vscode-input-border, rgba(255,255,255,.15));
      border-radius: 3px;
      padding: 6px 8px;
      outline: none;
      margin-bottom: 6px;
      display: block;
    }
    textarea:focus { border-color: var(--vscode-focusBorder); }
    textarea::placeholder { color: var(--vscode-input-placeholderForeground); }
    textarea:disabled { opacity: .5; }

    .input-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-run, .btn-stop {
      padding: 5px 14px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      font-family: var(--vscode-font-family);
      font-weight: 600;
    }

    .btn-run {
      background: var(--vscode-button-background);
      color: var(--vscode-button-foreground);
      flex: 1;
    }
    .btn-run:hover:not(:disabled) { background: var(--vscode-button-hoverBackground); }
    .btn-run:disabled { opacity: .5; cursor: default; }

    .btn-stop {
      background: var(--vscode-button-secondaryBackground, rgba(255,255,255,.1));
      color: var(--vscode-button-secondaryForeground, var(--vscode-foreground));
    }
    .btn-stop:hover { opacity: .85; }

    .hint {
      font-size: 10px;
      color: var(--muted);
      margin-left: auto;
    }

    /* ── Utility ────────────────────────────────────────────────────────── */
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- Header -->
<div class="header">
  <span class="header-brand">⚡ CINTO</span>
  <span class="header-model" id="headerModel">kernel ready</span>
  <span class="header-ctx hidden" id="headerCtx"></span>
</div>

<!-- Feed -->
<div class="feed" id="feed">
  <div class="welcome" id="welcome">
    <div class="welcome-title">Cinto Kernel</div>
    <p>A 5-stage structured pipeline for local AI code edits.</p>
    <ul>
      <li><b>Interpret</b> — understand the task</li>
      <li><b>Locate</b> — find relevant files</li>
      <li><b>Hypothesize</b> — plan the fix</li>
      <li><b>Patch</b> — write and apply the change</li>
      <li><b>Report</b> — summarize what happened</li>
    </ul>
  </div>

  <div id="runOutput" class="hidden">
    <div class="task-bubble" id="taskBubble"></div>
    <div id="pipelineCards" style="display:flex;flex-direction:column;gap:6px;margin-top:6px;"></div>
    <div class="result-card hidden" id="resultCard" style="margin-top:6px;">
      <div class="result-header">✓ Task complete</div>
      <div class="result-text" id="resultText"></div>
      <div class="result-files" id="resultFiles"></div>
    </div>
    <div class="error-card hidden" id="errorCard" style="margin-top:6px;"></div>
  </div>
</div>

<!-- Input -->
<div class="input-area">
  <textarea id="taskInput" placeholder="Describe a coding task… (Ctrl+Enter to run)"></textarea>
  <div class="input-actions">
    <button class="btn-run" id="btnRun">▶ Run</button>
    <button class="btn-stop hidden" id="btnStop">■ Stop</button>
    <span class="hint" id="hintText">Ctrl+Enter</span>
  </div>
</div>

<script nonce="{{nonce}}">
const vscode = acquireVsCodeApi();

// ── Element refs ──────────────────────────────────────────────────────────
const taskInput   = document.getElementById('taskInput');
const btnRun      = document.getElementById('btnRun');
const btnStop     = document.getElementById('btnStop');
const hintText    = document.getElementById('hintText');
const welcome     = document.getElementById('welcome');
const runOutput   = document.getElementById('runOutput');
const taskBubble  = document.getElementById('taskBubble');
const pipeline    = document.getElementById('pipelineCards');
const resultCard  = document.getElementById('resultCard');
const resultText  = document.getElementById('resultText');
const resultFiles = document.getElementById('resultFiles');
const errorCard   = document.getElementById('errorCard');
const headerModel = document.getElementById('headerModel');
const headerCtx   = document.getElementById('headerCtx');

// ── Runtime state ─────────────────────────────────────────────────────────
const stageStartTimes = {};
const pendingApprovals = {}; // id → { path }
const STAGES = ['interpret', 'locate', 'hypothesize', 'patch', 'report'];
const STAGE_LABELS = {
  interpret:   'Interpret',
  locate:      'Locate files',
  hypothesize: 'Hypothesize',
  patch:       'Patch',
  report:      'Report',
};
let changedFiles = [];

// ── Helpers ───────────────────────────────────────────────────────────────
function esc(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function pill(text, extra='') {
  return `<span class="pill${extra}">${esc(text)}</span>`;
}

function elapsed(stage) {
  const t = stageStartTimes[stage];
  if (!t) return '';
  const ms = Date.now() - t;
  return ms < 1000 ? `${ms}ms` : `${(ms/1000).toFixed(1)}s`;
}

function setRunning(running) {
  btnRun.disabled   = running;
  btnStop.classList.toggle('hidden', !running);
  taskInput.disabled = running;
  hintText.classList.toggle('hidden', running);
}

// ── Pipeline card management ──────────────────────────────────────────────
function initPipeline() {
  pipeline.innerHTML = '';
  STAGES.forEach(stage => {
    const card = document.createElement('div');
    card.className = 'stage-card';
    card.id = 'card-' + stage;
    card.dataset.status = 'pending';
    card.innerHTML = `
      <div class="stage-header">
        <span class="stage-dot"></span>
        <span class="stage-name">${STAGE_LABELS[stage]}</span>
        <span class="stage-time" id="time-${stage}"></span>
        <span class="stage-badge hidden" id="badge-${stage}"></span>
      </div>
      <div class="stage-body" id="body-${stage}"></div>
    `;
    pipeline.appendChild(card);
  });
}

function getCard(stage)  { return document.getElementById('card-' + stage); }
function getBody(stage)  { return document.getElementById('body-' + stage); }
function getTime(stage)  { return document.getElementById('time-' + stage); }
function getBadge(stage) { return document.getElementById('badge-' + stage); }

function setStageStatus(stage, status) {
  const card = getCard(stage);
  if (card) card.dataset.status = status;
}

function setBadge(stage, text, cls) {
  const b = getBadge(stage);
  if (!b) return;
  b.textContent = text;
  b.className = 'stage-badge ' + cls;
  b.classList.remove('hidden');
}

function hideBadge(stage) {
  const b = getBadge(stage);
  if (b) b.classList.add('hidden');
}

function updateTime(stage) {
  const t = getTime(stage);
  if (t) t.textContent = elapsed(stage);
}

// ── Diff rendering ────────────────────────────────────────────────────────
function renderDiffBlock(filePath, preview) {
  const lines = preview.split('\n').map(line => {
    let cls = '';
    if (line.startsWith('+') && !line.startsWith('+++')) cls = 'diff-add';
    else if (line.startsWith('-') && !line.startsWith('---')) cls = 'diff-remove';
    else if (line.startsWith('@@')) cls = 'diff-hunk';
    return `<span class="diff-line ${cls}">${esc(line)}</span>`;
  }).join('');

  return `
    <div class="diff-block">
      <div class="diff-file-bar">${esc(filePath)}</div>
      <div class="diff-lines">${lines}</div>
    </div>
  `;
}

// ── Event handlers ────────────────────────────────────────────────────────
window.addEventListener('message', ({ data: msg }) => {
  switch (msg.type) {

    case 'reset': {
      changedFiles = [];
      welcome.classList.add('hidden');
      runOutput.classList.remove('hidden');
      taskBubble.textContent = '';
      resultCard.classList.add('hidden');
      errorCard.classList.add('hidden');
      resultText.textContent = '';
      resultFiles.innerHTML = '';
      errorCard.textContent = '';
      initPipeline();
      setRunning(true);
      document.getElementById('feed').scrollTop = 0;
      break;
    }

    case 'focus_input':
      taskInput.focus();
      break;

    case 'kernel_ready': {
      headerModel.textContent = msg.model;
      const kb = Math.round(msg.context_budget / 1000);
      headerCtx.textContent = `${kb}k ctx`;
      headerCtx.classList.remove('hidden');
      break;
    }

    case 'stage_started': {
      stageStartTimes[msg.stage] = Date.now();
      setStageStatus(msg.stage, 'running');
      // Scroll card into view
      const card = getCard(msg.stage);
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      break;
    }

    case 'stage_completed': {
      const status = msg.crp_valid ? 'ok' : 'ok-approx';
      setStageStatus(msg.stage, status);
      updateTime(msg.stage);
      if (!msg.crp_valid) {
        setBadge(msg.stage, '~ plain text', 'badge-approx');
      } else {
        hideBadge(msg.stage);
      }
      break;
    }

    case 'stage_output': {
      const body = getBody(msg.stage);
      if (!body) break;

      if (msg.stage === 'interpret' && msg.search_terms?.length) {
        body.innerHTML += `<div class="content-label">Search terms</div>
          <div class="content-pills">${msg.search_terms.map(t => pill(t)).join('')}</div>`;
      }

      if (msg.stage === 'locate' && msg.relevant_files?.length) {
        body.innerHTML += `<div class="content-label">Files</div>
          <div class="content-pills">${msg.relevant_files.map(f => pill(f)).join('')}</div>`;
      }

      if (msg.stage === 'hypothesize' && msg.approach) {
        body.innerHTML += `<div class="approach-text">${esc(msg.approach)}</div>`;
      }
      break;
    }

    case 'stage_retry': {
      const body = getBody(msg.stage);
      if (body) {
        body.innerHTML += `<div class="retry-msg">⚠ Retry ${msg.attempt}: ${esc(msg.reason)}</div>`;
      }
      setBadge(msg.stage, `retry ${msg.attempt}`, 'badge-retry');
      break;
    }

    case 'stage_failed': {
      setStageStatus(msg.stage, 'failed');
      updateTime(msg.stage);
      setBadge(msg.stage, 'failed', 'badge-failed');
      const body = getBody(msg.stage);
      if (body) {
        body.innerHTML += `<div class="retry-msg">${esc(msg.error)}</div>`;
      }
      break;
    }

    case 'stage_skipped': {
      setStageStatus(msg.stage, 'skipped');
      setBadge(msg.stage, 'skipped', 'badge-skipped');
      break;
    }

    case 'patch_approval_requested': {
      pendingApprovals[msg.id] = { path: msg.path };
      setStageStatus('patch', 'approving');
      setBadge('patch', '● Review', 'badge-review');

      const body = getBody('patch');
      if (body) {
        const diffHtml = renderDiffBlock(msg.path, msg.preview);
        const approvalId = esc(msg.id);
        body.innerHTML += `
          ${diffHtml}
          <div class="approval-row">
            <button class="btn-approve" onclick="sendApproval('${approvalId}', true)">✓ Approve</button>
            <button class="btn-reject"  onclick="sendApproval('${approvalId}', false)">✗ Reject</button>
          </div>
        `;
        // Scroll into view
        const card = getCard('patch');
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      break;
    }

    case 'patch_applied': {
      changedFiles.push(...(msg.files_changed || []));
      // Mark approval rows as resolved in the patch body
      const body = getBody('patch');
      if (body) {
        body.querySelectorAll('.approval-row').forEach(row => {
          row.innerHTML = `<span style="font-size:11px;color:var(--green)">✓ Applied: ${esc((msg.files_changed||[]).join(', '))}</span>`;
        });
      }
      setStageStatus('patch', 'ok');
      hideBadge('patch');
      updateTime('patch');
      break;
    }

    case 'workflow_complete': {
      resultText.textContent = msg.final_response || '';
      resultFiles.innerHTML = changedFiles.map(f => pill(f)).join('');
      resultCard.classList.remove('hidden');
      setRunning(false);
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      break;
    }

    case 'workflow_failed': {
      errorCard.textContent = '✗ ' + (msg.error || 'Pipeline failed');
      errorCard.classList.remove('hidden');
      setRunning(false);
      errorCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      break;
    }

    case 'error': {
      // Surface as a small note in the error card if a run is active.
      if (!runOutput.classList.contains('hidden')) {
        errorCard.textContent = msg.message;
        errorCard.classList.remove('hidden');
      }
      break;
    }

    case 'agent_exited':
    case 'agent_stopped':
      setRunning(false);
      break;
  }
});

// ── Approval (called from inline button onclick) ──────────────────────────
function sendApproval(id, approved) {
  vscode.postMessage({ command: 'approve', id, approved });
}

// ── Run / Stop ────────────────────────────────────────────────────────────
btnRun.addEventListener('click', () => {
  const task = taskInput.value.trim();
  if (!task) { taskInput.focus(); return; }
  taskBubble.textContent = task;
  vscode.postMessage({ command: 'run', task });
});

btnStop.addEventListener('click', () => {
  vscode.postMessage({ command: 'stop' });
});

taskInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {

    btnRun.click();
