[package]
name = "cinto"
version = "0.1.0"
edition = "2024"
authors = ["Joao H."]
description = "A local terminal coding-agent harness for OpenAI-compatible model servers"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joaoh/cinto"
readme = "README.md"
keywords = ["agent", "cli", "llm", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
futures-util = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["macros", "rt-multi-thread", "sync"] }
toml = "0.8"
