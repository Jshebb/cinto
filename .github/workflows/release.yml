name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
            binary: cinto
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
            binary: cinto
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
            binary: cinto
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            binary: cinto
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            binary: cinto.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          tar -C dist -czf "cinto-${{ matrix.target }}.tar.gz" "${{ matrix.binary }}"
          python - <<'PY'
          import hashlib
          from pathlib import Path

          path = Path("cinto-${{ matrix.target }}.tar.gz")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          path.with_suffix(path.suffix + ".sha256").write_text(f"{digest}  {path.name}\n")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinto-${{ matrix.target }}
          path: |
            cinto-${{ matrix.target }}.tar.gz
            cinto-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
